<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome back</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg-top:#f3f2ff;
    --bg-bottom:#eceafd;
    --ink:#181425;
    --muted:#8b87a3;
    --card:#ffffff;
    --accent:#5850ec;
    --accent-deep:#453ed6;
    --accent-soft:#ecebff;
    --ring:#c9c5ff;
    --line:#e7e5f5;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    font-family:'Inter', sans-serif;
    background:
      radial-gradient(120% 60% at 50% -10%, var(--bg-top) 0%, var(--bg-bottom) 60%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    color:var(--ink);
  }

  .phone{
    width:100%;
    max-width:400px;
    background:var(--card);
    border-radius:32px;
    box-shadow:
      0 1px 2px rgba(24,20,37,0.04),
      0 24px 48px -12px rgba(69,62,214,0.18);
    overflow:hidden;
    position:relative;
    animation:rise .6s cubic-bezier(.2,.8,.2,1) both;
  }

  @keyframes rise{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }

  /* ---- header / constellation motif ---- */
  .header{
    position:relative;
    padding:44px 28px 30px;
    overflow:hidden;
    background:linear-gradient(180deg, var(--accent-soft) 0%, rgba(236,235,255,0) 100%);
  }

  .constellation{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    opacity:.9;
  }

  .eyebrow{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--accent-deep);
    background:rgba(255,255,255,0.6);
    padding:6px 12px;
    border-radius:999px;
    margin-bottom:18px;
  }

  .eyebrow .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 3px rgba(88,80,236,0.15);
  }

  h1{
    position:relative;
    font-family:'Sora', sans-serif;
    font-weight:800;
    font-size:32px;
    letter-spacing:-0.02em;
    line-height:1.1;
    margin-bottom:10px;
  }

  .sub{
    position:relative;
    font-size:14.5px;
    color:var(--muted);
    line-height:1.5;
    max-width:30ch;
  }

  /* ---- form ---- */
  form{
    padding:6px 28px 28px;
  }

  .field{
    margin-top:22px;
  }

  .field label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:8px;
  }

  .input-wrap{
    position:relative;
  }

  .input-wrap svg{
    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    opacity:.45;
  }

  input{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size:14.5px;
    padding:15px 16px 15px 44px;
    border-radius:16px;
    border:1.5px solid var(--line);
    background:#fbfaff;
    color:var(--ink);
    outline:none;
    transition:border-color .18s ease, box-shadow .18s ease, background .18s ease;
  }

  input::placeholder{ color:#b3afc9; }

  input:focus{
    border-color:var(--accent);
    background:#fff;
    box-shadow:0 0 0 4px var(--ring);
  }

  .row{
    display:flex;
    justify-content:flex-end;
    margin-top:12px;
  }

  .row a{
    font-size:13px;
    font-weight:600;
    color:var(--accent);
    text-decoration:none;
  }
  .row a:hover{ text-decoration:underline; }

  .btn-primary{
    width:100%;
    margin-top:26px;
    padding:16px;
    border:none;
    border-radius:16px;
    background:linear-gradient(180deg, var(--accent) 0%, var(--accent-deep) 100%);
    color:#fff;
    font-family:'Sora', sans-serif;
    font-weight:700;
    font-size:15.5px;
    letter-spacing:.01em;
    cursor:pointer;
    box-shadow:0 10px 22px -8px rgba(69,62,214,0.55);
    transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
  }

  .btn-primary:hover{
    transform:translateY(-1px);
    box-shadow:0 14px 26px -8px rgba(69,62,214,0.6);
    filter:brightness(1.04);
  }
  .btn-primary:active{ transform:translateY(0); }

  .divider{
    display:flex;
    align-items:center;
    gap:14px;
    margin:24px 0;
    color:var(--muted);
    font-size:12.5px;
  }
  .divider::before, .divider::after{
    content:'';
    flex:1;
    height:1px;
    background:var(--line);
  }

  .btn-google{
    width:100%;
    padding:14px;
    border-radius:16px;
    border:1.5px solid var(--line);
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14.5px;
    color:var(--ink);
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease, transform .15s ease;
  }
  .btn-google:hover{
    background:#fafafe;
    border-color:#d8d5ec;
    transform:translateY(-1px);
  }

  .footer{
    text-align:center;
    margin-top:24px;
    font-size:13.5px;
    color:var(--muted);
  }
  .footer a{
    color:var(--accent-deep);
    font-weight:600;
    text-decoration:none;
  }
  .footer a:hover{ text-decoration:underline; }

  @media (prefers-reduced-motion: reduce){
    .phone{ animation:none; }
    .btn-primary, .btn-google{ transition:none; }
  }
</style>
</head>
<body>

<div class="phone">
  <div class="header">
    <svg class="constellation" viewBox="0 0 400 170" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="340" cy="28" r="3" fill="#5850ec" opacity=".5"/>
      <circle cx="370" cy="70" r="2.5" fill="#5850ec" opacity=".35"/>
      <circle cx="320" cy="90" r="2" fill="#5850ec" opacity=".3"/>
      <circle cx="380" cy="20" r="2" fill="#5850ec" opacity=".3"/>
      <line x1="340" y1="28" x2="370" y2="70" stroke="#5850ec" stroke-width="1" opacity=".2"/>
      <line x1="340" y1="28" x2="320" y2="90" stroke="#5850ec" stroke-width="1" opacity=".15"/>
      <line x1="340" y1="28" x2="380" y2="20" stroke="#5850ec" stroke-width="1" opacity=".15"/>
    </svg>

    <div class="eyebrow"><span class="dot"></span>Campus Circle</div>
    <h1>Welcome back</h1>
    <p class="sub">Sign in to continue to your community.</p>
  </div>

  <form onsubmit="return false;">
    <div class="field">
      <label for="id">Email / Student ID</label>
      <div class="input-wrap">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8b87a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z" opacity="0"/><path d="M22 6c0-1.1-.9-2-2-2H4a2 2 0 0 0-2 2v12c0 1.1.9 2 2 2h16a2 2 0 0 0 2-2V6Z"/><path d="m22 6-10 7L2 6"/></svg>
        <input id="id" type="text" placeholder="student@example.com">
      </div>
    </div>

    <div class="field">
      <label for="pw">Password</label>
      <div class="input-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8b87a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input id="pw" type="password" placeholder="••••••••" value="password">
      </div>
    </div>

    <div class="row">
      <a href="#">Forgot password?</a>
    </div>

    <button class="btn-primary" type="submit">Log in</button>

    <div class="divider">or</div>

    <button class="btn-google" type="button">
      <svg width="17" height="17" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.66-.22-2.44H12v4.63h6.48a5.54 5.54 0 0 1-2.4 3.63v3h3.88c2.27-2.09 3.56-5.17 3.56-8.82Z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.91l-3.88-3c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.95H1.26v3.1A11.99 11.99 0 0 0 12 24Z"/><path fill="#FBBC05" d="M5.27 14.29a7.2 7.2 0 0 1 0-4.58v-3.1H1.26a12 12 0 0 0 0 10.78l4.01-3.1Z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.44-3.44C17.95 1.19 15.23 0 12 0 7.31 0 3.26 2.69 1.26 6.61l4.01 3.1C6.22 6.86 8.87 4.75 12 4.75Z"/></svg>
      Continue with Google
    </button>

    <p class="footer">New to Campus Circle? <a href="#">Create an account</a></p>
  </form>
</div>

</body>
</html>
