<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your community</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg-top:#f3f2ff;
    --bg-bottom:#eceafd;
    --ink:#181425;
    --muted:#8b87a3;
    --card:#ffffff;
    --accent:#5850ec;
    --accent-deep:#453ed6;
    --accent-soft:#ecebff;
    --ring:#c9c5ff;
    --line:#e7e5f5;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    font-family:'Inter', sans-serif;
    background:radial-gradient(120% 60% at 50% -10%, var(--bg-top) 0%, var(--bg-bottom) 60%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    color:var(--ink);
  }

  .phone{
    width:100%;
    max-width:400px;
    animation:rise .6s cubic-bezier(.2,.8,.2,1) both;
  }

  @keyframes rise{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }

  .header{
    padding:6px 4px 26px;
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--accent-deep);
    background:var(--accent-soft);
    padding:6px 12px;
    border-radius:999px;
    margin-bottom:16px;
  }
  .eyebrow .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 3px rgba(88,80,236,0.15);
  }

  h1{
    font-family:'Sora', sans-serif;
    font-weight:800;
    font-size:32px;
    letter-spacing:-0.02em;
    line-height:1.1;
    margin-bottom:10px;
  }

  .sub{
    font-size:14.5px;
    color:var(--muted);
    line-height:1.5;
  }

  .card{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:24px;
    padding:26px 24px;
    margin-top:20px;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    position:relative;
    overflow:hidden;
  }

  .card:hover{
    transform:translateY(-2px);
    box-shadow:0 16px 32px -14px rgba(69,62,214,0.22);
    border-color:#dcd9f4;
  }

  .card.primary::before{
    content:'';
    position:absolute;
    top:-40px; right:-40px;
    width:120px; height:120px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(88,80,236,0.10) 0%, rgba(88,80,236,0) 70%);
  }

  .icon-badge{
    width:38px; height:38px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:14px;
  }
  .card.primary .icon-badge{ background:var(--accent-soft); }
  .card.secondary .icon-badge{ background:#f4f3fb; }

  .card h2{
    font-family:'Sora', sans-serif;
    font-weight:700;
    font-size:19px;
    letter-spacing:-0.01em;
    margin-bottom:8px;
  }

  .card p{
    font-size:13.5px;
    color:var(--muted);
    line-height:1.5;
    margin-bottom:20px;
  }

  .btn{
    width:100%;
    padding:15px;
    border-radius:16px;
    font-family:'Sora', sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:.01em;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, filter .15s ease, background .15s ease, color .15s ease, border-color .15s ease;
    text-align:center;
  }

  .btn-primary{
    border:1.5px solid var(--line);
    background:#9ec3cf;
    color:var(--ink);
    
  }
  .btn-primary:hover{
   background:var(--accent);
    border-color:var(--accent);
    color:#9ec3cf;
    transform:translateY(-1px);
    box-shadow:0 14px 26px -8px rgba(69,62,214,0.5);
  }

  .btn-secondary{
    border:1.5px solid var(--line);
    background:#9ec3cf;
    color:var(--ink);
  }
  .btn-secondary:hover{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    transform:translateY(-1px);
    box-shadow:0 14px 26px -8px rgba(69,62,214,0.5);
  }

  .footer-note{
    text-align:center;
    margin-top:22px;
    font-size:13px;
    color:#b3afc9;
  }

  @media (prefers-reduced-motion: reduce){
    .phone{ animation:none; }
    .card, .btn-primary, .btn-secondary{ transition:none; }
  }
</style>
</head>
<body>

<div class="phone">
  <div class="header">
    <div class="eyebrow"><span class="dot"></span>Step 2 of 2</div>
    <h1>Your community</h1>
    <p class="sub">Create a new space or join an existing one.</p>
  </div>

  <div class="card primary">
    <div class="icon-badge">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#5850ec" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </div>
    <h2>Create a community</h2>
    <p>Set course, semester and section.</p>
    <a class="btn btn-primary" href="#" style="display:block; text-decoration:none;">Create community</a>
  </div>

  <div class="card secondary">
    <div class="icon-badge">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8b87a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v4M9 21H5a2 2 0 0 1-2-2v-4M21 3l-7 7M3 21l7-7"/></svg>
    </div>
    <h2>Enter a community</h2>
    <p>Use your community ID and student code.</p>
    <a class="btn btn-secondary" href="#" style="display:block; text-decoration:none;">Enter community</a>
  </div>

  <p class="footer-note">Community access can be changed later.</p>
</div>

</body>
</html>
